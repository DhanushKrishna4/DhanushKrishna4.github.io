<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first for anything that supports it, PNG behind for anything that
         does not, and the touch icon separately because iOS will not take an
         SVG and applies its own corner mask. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is what lets the page paint into the status bar and
         home indicator at all. Without it the browser insets the viewport to the
         safe area and fills the rest with the page's BACKGROUND COLOUR — one
         static value, which is why the bar stayed paper no matter what section
         was under it. It also makes every env(safe-area-inset-*) below report a
         real number; they are all 0 until this is here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dhanush Krishna — Machine Learning &amp; Cybersecurity</title>
    <!-- Before the stylesheet lands. Same reason as body.is-ready in
         index.css: the first paint has to already be the loader colour. -->
    <style>html,body{margin:0}body{background:#d2ff00}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
