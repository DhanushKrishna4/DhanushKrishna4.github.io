<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first for anything that supports it, PNG behind for anything that
         does not, and the touch icon separately because iOS will not take an
         SVG and applies its own corner mask. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- iOS tints the status bar and the toolbar with this. Without it Safari
         guesses from the page and guessed white, so the accent stopped at the
         safe areas and the loader read as a lime band with white above and
         below it instead of a full screen. Starts on the accent because that is
         what the loader paints; lib/tone.ts moves it with the page after that. -->
    <meta name="theme-color" content="#d2ff00" />
    <title>Dhanush Krishna — Machine Learning &amp; Cybersecurity</title>
    <!-- Before the stylesheet lands. Same reason as body.is-ready in
         index.css: the first paint has to already be the loader colour. -->
    <style>html,body{margin:0;background:#d2ff00}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
