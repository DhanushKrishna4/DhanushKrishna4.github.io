<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first for anything that supports it, PNG behind for anything that
         does not, and the touch icon separately because iOS will not take an
         SVG and applies its own corner mask.

         ?v=8 because these went from lime to red and the old ones were already
         cached. A favicon is not fetched with the page: browsers keep a separate
         icon store, Safari's most stubbornly of all, and it survives a hard
         reload and a normal cache clear. The file contents changed but the URL
         did not, so nothing went back to ask. Bumping the query makes it a new
         URL, which is the only thing that reliably re-fetches — and it fixes it
         for everyone who has already visited, not just for this machine. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=8" />
    <!-- viewport-fit=cover is what lets the page paint into the status bar and
         home indicator at all. Without it the browser insets the viewport to the
         safe area and fills the rest with the page's BACKGROUND COLOUR — one
         static value, which is why the bar stayed paper no matter what section
         was under it. It also makes every env(safe-area-inset-*) below report a
         real number; they are all 0 until this is here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dhanush Krishna — Machine Learning &amp; Cybersecurity</title>
    <meta
      name="description"
      content="Final-year Computer Science student at BITS Pilani Dubai, based in Abu Dhabi. Machine learning and cybersecurity — private LLM infrastructure, voice interfaces and data tooling."
    />
    <link rel="canonical" href="https://dhanushkrishna4.github.io/" />

    <!-- The card is a TRUECOLOUR png (colour type 2), and must stay one. It was
         written with a palette to save 66 KB and LinkedIn rendered it as a blank
         white box: indexed PNGs are a long-standing failure in its scraper, and
         the Post Inspector reports a clean scrape while showing nothing, so
         there is no error to go on. 129 KB is the price of it working.

         The link preview card. Absolute URLs throughout, which is not optional:
         LinkedIn, Slack and iMessage all fetch og:image from their own servers
         with no page context, so a root-relative path resolves against their
         host and the card comes back blank — which is what it was doing, along
         with having no image to point at in the first place.

         og:image:width and :height let a crawler reserve the slot before the
         file lands; without them LinkedIn has been known to fall back to the
         small square layout even when the image is the right shape. 1200x630 is
         the Open Graph recommendation and satisfies LinkedIn's 1.91:1 slot. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dhanush Krishna" />
    <meta property="og:url" content="https://dhanushkrishna4.github.io/" />
    <meta property="og:title" content="Dhanush Krishna — Machine Learning &amp; Cybersecurity" />
    <meta
      property="og:description"
      content="Final-year Computer Science student at BITS Pilani Dubai, based in Abu Dhabi. Machine learning and cybersecurity — private LLM infrastructure, voice interfaces and data tooling."
    />
    <meta property="og:image" content="https://dhanushkrishna4.github.io/card.png" />
    <meta property="og:image:secure_url" content="https://dhanushkrishna4.github.io/card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DHANUSH KRISHNA, signed" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dhanush Krishna — Machine Learning &amp; Cybersecurity" />
    <meta
      name="twitter:description"
      content="Final-year Computer Science student at BITS Pilani Dubai, based in Abu Dhabi. Machine learning and cybersecurity — private LLM infrastructure, voice interfaces and data tooling."
    />
    <meta name="twitter:image" content="https://dhanushkrishna4.github.io/card.png" />
    <meta name="twitter:image:alt" content="DHANUSH KRISHNA, signed" />
    <!-- Before the stylesheet lands. Same reason as body.is-ready in
         index.css: the first paint has to already be the loader colour. -->
    <style>html,body{margin:0}body{background:#c1121f}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
